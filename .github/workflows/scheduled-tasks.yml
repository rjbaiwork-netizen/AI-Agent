name: Scheduled Tasks & Health Check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "personal-bot-agent/bot/**"
      - "personal-bot-agent/agent/**"
      - "personal-bot-agent/requirements.txt"
      - ".github/workflows/scheduled-tasks.yml"

permissions:
  contents: write

concurrency:
  group: personal-bot-agent-main-write
  cancel-in-progress: false

jobs:
  run-scheduled-tasks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-bot-agent
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: personal-bot-agent/requirements.txt

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          echo "Installing personal-bot-agent dependencies..."
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "Dependencies installed successfully."

      - name: Run real scheduled checks and append logs
        env:
          PYTHONPATH: .
          GUARDRAIL_MAX_STEPS: "10"
          GUARDRAIL_TIMEOUT_SEC: "60"
        run: |
          set -Eeuo pipefail
          echo "Running bot.actions.check_system_status() and list_tasks()..."
          python - <<'PY'
          import json
          import traceback
          from datetime import datetime, timezone
          from pathlib import Path

          from bot.actions import check_system_status, list_tasks

          data_dir = Path("data")
          logs_dir = Path("logs")
          logs_dir.mkdir(parents=True, exist_ok=True)
          data_dir.mkdir(parents=True, exist_ok=True)

          def validate_json(path: Path):
              if not path.exists():
                  return {"exists": False, "valid": None}
              try:
                  with path.open("r", encoding="utf-8") as handle:
                      json.load(handle)
              except Exception as exc:
                  raise RuntimeError(f"Invalid JSON in {path}: {exc}") from exc
              return {"exists": True, "valid": True}

          try:
              system_result = check_system_status()
              if not isinstance(system_result, dict):
                  raise TypeError("check_system_status() must return a dictionary")

              task_result = list_tasks()
              if not isinstance(task_result, list):
                  raise TypeError("list_tasks() must return a list")

              json_checks = {
                  "notes.json": validate_json(data_dir / "notes.json"),
                  "tasks.json": validate_json(data_dir / "tasks.json"),
              }
              timestamp = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
              status = str(system_result.get("status", "unknown"))
              task_count = len(task_result)
              summary = (
                  f"system_status={status}; task_count={task_count}; "
                  f"json_files_validated={sum(1 for item in json_checks.values() if item['valid'] is True)}"
              )
              details = {
                  "system_check": system_result,
                  "task_count": task_count,
                  "json_validation": json_checks,
              }

              with (logs_dir / "bot.log").open("a", encoding="utf-8") as handle:
                  handle.write(
                      f"{timestamp} | event=scheduled_tasks | status={status} | "
                      f"system_check={json.dumps(system_result, ensure_ascii=False, sort_keys=True)} | "
                      f"task_count={task_count}\n"
                  )

              trace = {
                  "timestamp": timestamp,
                  "event_type": "scheduled_tasks",
                  "status": status,
                  "summary": summary,
                  "details": details,
              }
              with (logs_dir / "trace.jsonl").open("a", encoding="utf-8") as handle:
                  handle.write(json.dumps(trace, ensure_ascii=False, sort_keys=True) + "\n")

              print(f"Scheduled task run completed at {timestamp}")
              print(f"System check: {json.dumps(system_result, ensure_ascii=False)}")
              print(f"Task count: {task_count}")
              print(f"JSON validation: {json.dumps(json_checks, ensure_ascii=False)}")
          except Exception:
              print("ERROR: Scheduled task execution or validation failed.", flush=True)
              traceback.print_exc()
              raise
          PY
          echo "Scheduled checks and JSONL trace appended successfully."

      - name: Commit and safely push generated data to main
        working-directory: .
        run: |
          set -Eeuo pipefail
          echo "Checking generated data/log changes..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- personal-bot-agent/logs/ personal-bot-agent/data/
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "chore(bot): record scheduled health and task check"
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3: rebasing onto origin/main..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "ERROR: Rebase conflict; refusing to overwrite remote main."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Generated logs and data pushed to main."
              exit 0
            fi
            echo "Push attempt ${attempt} did not succeed; will retry after fetching."
            sleep $((attempt * 2))
          done
          echo "ERROR: Could not push generated data after 3 safe attempts."
          exit 1
