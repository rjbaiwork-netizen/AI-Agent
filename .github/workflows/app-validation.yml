name: Application Validation

on:
  push:
    branches:
      - main
    paths:
      - "personal-bot-agent/**"
      - ".github/workflows/app-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-validation-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-bot-agent
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: personal-bot-agent/requirements.txt

      - name: Install application dependencies
        run: |
          set -Eeuo pipefail
          echo "Installing Python dependencies..."
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all Python modules
        run: |
          set -Eeuo pipefail
          echo "Compiling application and test modules..."
          python -m compileall -q bot agent app.py tests
          echo "Python compilation passed."

      - name: Validate JSON, YAML, Markdown fences and frontend JavaScript
        run: |
          set -Eeuo pipefail
          echo "Validating routing JSON..."
          python -m json.tool bot/rules.json >/dev/null
          echo "Checking JavaScript syntax..."
          node --check ui/app.js
          echo "Checking workflow YAML syntax..."
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file); puts "YAML syntax OK: #{file}" }' ../.github/workflows/scheduled-tasks.yml ../.github/workflows/brain-reverify.yml ../.github/workflows/backup-sync.yml ../.github/workflows/app-validation.yml ../.github/workflows/pages-deploy.yml
          echo "Checking setup guide fenced code blocks..."
          python - <<'PY'
          from pathlib import Path
          guide = Path("setup_guide.md").read_text(encoding="utf-8")
          fences = sum(1 for line in guide.splitlines() if line.strip().startswith("```"))
          if fences % 2:
              raise SystemExit(f"Unclosed Markdown code fence: {fences} fence markers")
          print(f"Markdown fences balanced: {fences} markers")
          PY

      - name: Run isolated Flask API end-to-end smoke tests
        env:
          GEMINI_API_KEY: ""
          APP_HOST: "127.0.0.1"
          APP_PORT: "8000"
        run: |
          set -Eeuo pipefail
          echo "Running Flask test-client integration tests..."
          python -m unittest discover -s tests -v
          echo "Application API smoke tests passed."
