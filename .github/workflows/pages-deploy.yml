name: GitHub Pages Deployment

on:
  push:
    branches:
      - main
    paths:
      - "personal-bot-agent/ui/**"
      - "personal-bot-agent/app.py"
      - ".github/scripts/build-pages.py"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enable GitHub Pages with Actions source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages site already exists."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
            echo "GitHub Pages site created with GitHub Actions as source."
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static frontend
        run: python .github/scripts/build-pages.py
      - name: Validate Pages artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          site = Path("_site")
          html = (site / "index.html").read_text(encoding="utf-8")
          assert 'href="./styles.css"' in html
          assert 'src="./app.js"' in html
          assert all((site / name).is_file() for name in ("styles.css", "app.js", ".nojekyll"))
          js = (site / "app.js").read_text(encoding="utf-8")
          assert "BACKEND_STORAGE_KEY" in js
          assert "Backend not connected" in js
          print("Pages HTML, CSS, JS and backend-configuration checks passed.")
          PY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
