name: Backup & Sync Workspace Data

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "personal-bot-agent/data/**"
      - "personal-bot-agent/logs/**"

permissions:
  contents: write

concurrency:
  group: personal-bot-agent-main-write
  cancel-in-progress: false

jobs:
  backup-sync:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-bot-agent
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: personal-bot-agent/requirements.txt

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          echo "Installing personal-bot-agent dependencies..."
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "Dependencies installed successfully."

      - name: Validate and prepare data/log backup
        run: |
          set -Eeuo pipefail
          echo "Ensuring required data and log paths exist and validating JSON/JSONL..."
          python - <<'PY'
          import json
          import traceback
          from datetime import datetime, timezone
          from pathlib import Path

          try:
              data_dir = Path("data")
              logs_dir = Path("logs")
              (data_dir / "workspace").mkdir(parents=True, exist_ok=True)
              (data_dir / "brain_versions").mkdir(parents=True, exist_ok=True)
              logs_dir.mkdir(parents=True, exist_ok=True)

              for name in ("notes.json", "tasks.json"):
                  path = data_dir / name
                  if not path.exists():
                      path.write_text("[]\n", encoding="utf-8")
                      print(f"Created missing JSON file: {path}")
                  with path.open("r", encoding="utf-8") as handle:
                      json.load(handle)
                  print(f"Validated JSON: {path}")

              for name in ("bot.log", "trace.jsonl"):
                  path = logs_dir / name
                  path.touch(exist_ok=True)
                  print(f"Ensured log file: {path}")

              for path in sorted((data_dir / "brain_versions").glob("*.json")):
                  with path.open("r", encoding="utf-8") as handle:
                      json.load(handle)
                  print(f"Validated brain version JSON: {path}")

              trace_path = logs_dir / "trace.jsonl"
              with trace_path.open("r", encoding="utf-8") as handle:
                  for line_number, line in enumerate(handle, start=1):
                      if not line.strip():
                          continue
                      try:
                          json.loads(line)
                      except json.JSONDecodeError as exc:
                          raise RuntimeError(
                              f"Invalid JSONL at {trace_path}:{line_number}: {exc}"
                          ) from exc

              timestamp = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
              details = {
                  "validated_json_files": ["data/notes.json", "data/tasks.json"],
                  "validated_brain_version_reports": len(list((data_dir / "brain_versions").glob("*.json"))),
                  "trace_lines_validated": sum(
                      1 for line in trace_path.read_text(encoding="utf-8").splitlines() if line.strip()
                  ),
                  "directories": ["data/workspace", "data/brain_versions", "logs"],
              }
              trace = {
                  "timestamp": timestamp,
                  "event_type": "backup_sync",
                  "status": "success",
                  "summary": "Data and logs validated and prepared for main-branch backup sync.",
                  "details": details,
              }
              with trace_path.open("a", encoding="utf-8") as handle:
                  handle.write(json.dumps(trace, ensure_ascii=False, sort_keys=True) + "\n")

              print("Backup validation completed successfully.")
              print(json.dumps(details, ensure_ascii=False, indent=2))
          except Exception:
              print("ERROR: Backup preparation or JSON validation failed.", flush=True)
              traceback.print_exc()
              raise
          PY
          echo "Data/log validation and backup trace completed."

      - name: Commit and safely push only data/log changes to main
        working-directory: .
        run: |
          set -Eeuo pipefail
          echo "Checking only personal-bot-agent/data and personal-bot-agent/logs..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- personal-bot-agent/data/ personal-bot-agent/logs/
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "chore(backup): validate and sync bot data and logs"
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3: rebasing onto origin/main..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "ERROR: Rebase conflict; refusing to overwrite remote main."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Data and logs safely pushed to main."
              exit 0
            fi
            echo "Push attempt ${attempt} did not succeed; will retry after fetching."
            sleep $((attempt * 2))
          done
          echo "ERROR: Could not push backup data after 3 safe attempts."
          exit 1
