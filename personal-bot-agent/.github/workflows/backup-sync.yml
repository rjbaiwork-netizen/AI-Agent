name: Backup and data integrity
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m json.tool personal-bot-agent/data/notes.json >/dev/null
      - run: python -m compileall -q personal-bot-agent
