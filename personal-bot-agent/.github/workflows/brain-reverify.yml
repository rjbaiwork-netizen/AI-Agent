name: Brain re-verification
on:
  push:
    branches: [main]
    paths: ['personal-bot-agent/agent/brains/**','personal-bot-agent/agent/reverify.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r personal-bot-agent/requirements.txt
      - run: python personal-bot-agent/agent/reverify.py
